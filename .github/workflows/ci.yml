name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is the arm64 runner, which is where the MPS path and the
        # XProtect codesigning problem live. ubuntu-latest is x86_64 on CPU,
        # which is what the Docker image and most contributors run.
        os: [macos-14, ubuntu-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # opencv-python links against libGL at import time. Without these two,
      # `import cv2` fails with an ImportError about libGL.so.1 that does not
      # name the missing apt package.
      - name: Install libGL for opencv
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1 libglib2.0-0

      # pdf is in here because tests/unit/test_pdf.py exercises the real
      # reportlab output, not a stub.
      - name: Install
        run: uv pip install --system -e '.[permissive,api,pdf,dev]'

      # No weights are fetched. The suite has no network access by design, and
      # tests/integration/test_offline.py proves the block before asserting
      # anything under it. Tests that need a checkpoint are marked
      # needs_weights and skip.
      - name: Test
        run: python -m pytest -q

      # Ruff has a backlog of findings that predate this workflow. They are
      # burned down in reviewable batches, not swept: a `ruff --fix` pass over
      # this tree has already destroyed uncommitted work once. Failing CI on a
      # backlog only teaches people that a red check is normal, so this step
      # reports and does not block.
      - name: Lint
        continue-on-error: true
        run: python -m ruff check src tests

      - name: Types
        continue-on-error: true
        run: python -m mypy

  build:
    name: build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: twine check
        run: python -m twine check dist/*

      # The web UI has to travel with the wheel through force-include, or
      # `faciometry serve` has nothing to serve. That is easy to break silently.
      - name: The wheel carries the web UI, and the CLI runs from it
        run: |
          wheel="$(ls dist/*.whl)"
          python - "$wheel" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          web = [n for n in names if n.startswith("faciometry/web/")]
          assert web, "the wheel has no faciometry/web/, so serve would 404"
          print(len(web), "web assets in the wheel")
          PY
          python -m pip install "$wheel"
          faciometry --version
          faciometry catalogue --json > /dev/null
          faciometry licenses --tier copyleft | grep -q "becomes AGPL-3.0"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: docker image serves /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: faciometry:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id faciometry:ci -u)"
          if [ "$uid" = "0" ]; then echo "container is running as root"; exit 1; fi
          echo "uid $uid"

      - name: torch inside the image is the CPU build
        run: |
          docker run --rm --entrypoint python faciometry:ci -c \
            "import torch; assert '+cpu' in torch.__version__, torch.__version__; print(torch.__version__)"

      - name: /health returns ok
        run: |
          docker run -d --name faciometry-ci -p 127.0.0.1:8731:8731 faciometry:ci
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8731/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          python - <<'PY'
          import json
          h = json.load(open("health.json"))
          assert h["status"] == "ok", h
          assert h["license_tier"] == "permissive", h
          assert h["storing_uploads"] is False, h
          assert h["device"] == "cpu", h
          print("health ok:", h)
          PY

      - name: The bind warning was printed
        run: docker logs faciometry-ci 2>&1 | grep -q "reachable from the network"

      - name: Stop
        if: always()
        run: docker rm -f faciometry-ci || true
