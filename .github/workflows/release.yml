name: Release

# Tag-driven. `git tag v0.1.0 && git push --tags` is the whole release
# procedure, and the version in pyproject.toml has to match the tag or the
# check-tag job stops before anything is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and check, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build and check the distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: The tag and the version in pyproject.toml agree
        id: version
        run: |
          version="$(python -c "
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          ")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "tag v$tag does not match pyproject version $version" >&2
              exit 1
            fi
          fi
          echo "version $version"

      - name: The wheel installs and runs
        run: |
          python -m pip install "$(ls dist/*.whl)"
          vitruve --version
          vitruve catalogue --json > /dev/null
          vitruve licenses --tier permissive > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/vitruve
    permissions:
      # Trusted publishing. The runner mints a short-lived OIDC token that PyPI
      # exchanges for an upload credential, so there is no API token in the
      # repository secrets to leak or rotate. Configure the publisher once at
      # https://pypi.org/manage/account/publishing/ against this repository,
      # this workflow filename, and the `pypi` environment.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create the GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            dist/*
